# IMXRT1060-series MCUs (e.g. Teensy 4.1) based on ARMv7

include("arm_thumb_common")

# IMXRT1060 chips use a flat memory model to address flash and RAM.
# .text starts at 6000_0000h, and .data and .bss are loaded at 2000_0000h.
TEXT_SEGMENT_MIN = 0x60000000
DATA_SEGMENT_MIN = 0x20000000

# Other peripherals that perform I/O with the CPU have I/O channels,
# registers, external RAM, etc. at 40000000h and up.
PERIPHERAL_SEGMENT_MIN = 0x40000000
PERIPHERAL_SEGMENT_MAX = 0x5FFFFFFF

# TODO: There are more peripherals starting at E000_0000h, but we
# need to extend thumb_interface.py to support it.


# 1024KB RAM in two 512KB chunks, starting at 0x2000_0000 and 0x2020_0000
# The lower segment is the main memory and the upper segment is the "DMAMEM"
# segment. We consolidate this to a single logical "RAM" block as we currently
# only have the ability to define "flash" and "RAM" segments. The "FASTMEM" 
# segment for code execution is excluded from this crude memory map.
#
# TODO(aaron): PyArduinoDbg needs to have a more nuanced ability to desrcribe
# multi-segment memory for Teensy. memory_map.py has the bones for it, but 
# thumb_interface.py is actually very Cortex-specific as-written.

RAMSTART = 0x20000000
RAMSIZE = 0x280000
RAMEND  = 0x2027FFFF

# Flash capacity 8MB
FLASHSTART = 0x60000000
FLASHEND = 0x607FFFFF

# 600MHz CPU
clock_freq = 600000000

# Can we use an onboard debug module to single-step the CPU?
single_step_supported = True

# Set of values returned by memory report function
mem_list_fmt = [ "SP", "HeapEnd", "HeapStart" ]
